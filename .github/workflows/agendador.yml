name: B3&Crypto Monitor

on:
  schedule:
    - cron: "0/5 10-18 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  executar-agendador:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar ambiente Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar bibliotecas necessárias
        run: |
          pip install yfinance requests

      - name: Executar script de monitoramento
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python monitor.py

      - name: Auto-renovação para evitar inatividade do dias
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull
          date >> keepalive.txt
          git add keepalive.txt
          git commit -m "Heartbeat automático para manter o repositório ativo" || exit 0
          git push
